<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shroom IMG Tool</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
                "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
                sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
        }
        html, body, canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        canvas {
            background: #1e1e1e;
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #0ea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<link rel="modulepreload" href="https://jon-zu.github.io/shroom-img-tool/shroom-img-tool-c0d30d6f2e7e9c64.js" crossorigin=anonymous integrity="sha384-Tj7mBxBCRynZAfCtdJz7iAPYnvfv8fCAvfosM6PvyKayqjc2uDUZ/VBsVsKfadYl"><link rel="preload" href="https://jon-zu.github.io/shroom-img-tool/shroom-img-tool-c0d30d6f2e7e9c64_bg.wasm" crossorigin=anonymous integrity="sha384-wvW4Hx+WqgMtKnC29Cucbpi1JrBUsXIx5ab380aFgpjsLR4Ycos3oFFKqxh/ok3O" as="fetch" type="application/wasm"></head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading Shroom IMG Tool...</p>
    </div>
    <canvas id="the_canvas_id"></canvas>

<script type="module" nonce="UNyNuNjkJN5/eBTT3b87hQ==">

window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
